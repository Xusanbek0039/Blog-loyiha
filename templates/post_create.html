{% extends 'partials/_base.html' %}
{% load static %}
{% block content %}
<head>
    <!-- Meta taglar ITC-Blog.uz uchun -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="it park blog, itc blog, it center blog, it park zomin, suyunov husan, husan suyunov, it center zomin, zomin blog, dasturlash blogi, sun’iy intellekt, startap yangiliklari" />

    <meta name="description" content="ITC-Blog.uz — bu IT Park Zomin rezidentlari tomonidan yuritiladigan platforma bo‘lib, dasturlash, sun’iy intellekt, startaplar va texnologik yangiliklarga oid maqolalar va qo‘llanmalar joylashtiriladi." />

    <meta name="robots" content="index,follow" />
    <meta name="Googlebot" content="index,follow" />
    <meta name="AdsBot-Google" content="index,follow" />

    <!-- Open Graph ijtimoiy tarmoqlar uchun -->
    <meta property="og:site_name" content="ITC-Blog.uz">
    <meta property="og:title" content="ITC-Blog.uz | IT Park Zomin Rasmiy Blogi">
    <meta property="og:description" content="Dasturlash, sun’iy intellekt, startaplar va IT yangiliklari haqida maqolalar va qo‘llanmalar — IT Park Zomin tomonidan.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://itc-blog.uz/">
    <meta property="og:image" content="https://xusanbek0039.github.io/Blog-loyiha/static/images/it%20park%20zomin%20blog.png">

    <!-- Twitter uchun -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="https://itc-blog.uz/">
    <meta name="application-name" content="ITC-Blog.uz | IT Park Zomin" />
    <meta name="apple-mobile-web-app-title" content="ITC-Blog.uz" />
    <meta name="summary" content="IT Park Zomin tomonidan yaratilgan IT blog platformasi — ITC-Blog.uz" />

</head>
<section class="site-section">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-6 offset-md-3">
                    <h1>Yangi post joylash</h1>
                </div>
            </div>
            <div class="row blog-entries">
                <div class="col-md-12 col-lg-8 offset-lg-2 main-content">

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-12 form-group">
                                <label for="first_name">Turkum</label>
                                {{ form.category }}
                            </div>
                            <div class="col-md-12 form-group">
                                <label for="last_name">Teglar</label>
                                {{ form.tags }}
                            </div>
                            <div class="col-md-12 form-group">
                                <label for="username">Sarlavha</label>
                                {{ form.title }}
                            </div>
                            <div class="col-md-12 form-group">
                                <label for="email">Rasm</label>
                                {{ form.image }}
                            </div>
                            <div class="col-md-12 form-group" >
                                <label for="title" >Tarkib</label>
                                {{ form.content }}
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <input type="submit" value="Post joylash" class="btn btn-primary rounded">
                            </div>
                        </div>

                    </form>
                    <!-- TODO: Post Oluşturma, Giriş yapan kullanıcının kendi post'larını düzenlemesi, silmesi -->
                </div>
                <script>
                    $('input, select').addClass('form-control');
                    $('textarea').attr('cols','100').addClass('form-control');
                    $('input[type="submit"]').removeClass('form-control');
                </script>

                <!-- END main-content -->


{% endblock %}
